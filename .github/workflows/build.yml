name: Build

on:
    push:
        branches: [master]
        tags: ['v*']
    pull_request:
    workflow_dispatch:

jobs:
    build:
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Setup xmake
              uses: xmake-io/github-action-setup-xmake@v1
              with:
                  xmake-version: latest

            - name: Cache xmake packages
              uses: actions/cache@v4
              with:
                  path: |
                      ~/AppData/Local/.xmake/packages
                  key: xmake-packages-${{ runner.os }}-${{ hashFiles('xmake-requires.lock') }}
                  restore-keys: |
                      xmake-packages-${{ runner.os }}-

            - name: Configure
              run: xmake f -p windows -a x64 -m releasedbg --deploy_dir="" -y

            - name: Build
              run: xmake build

            - name: Run C++ runtime behavior tests
              run: xmake run HouseRulesRuntimeTests

            - name: Validate generated settings
              run: python tools/generate_settings.py --check

            - name: Run deterministic tests
              run: python -m unittest discover -s tests -v

            - name: Validate generated hook data
              run: python tools/gen_hook_sites.py --check

            - name: Create Nexus release archive
              shell: pwsh
              run: |
                  $releaseArgs = @()
                  if ($env:GITHUB_REF_TYPE -eq "tag") {
                      $releaseArgs = @("--release-tag", $env:GITHUB_REF_NAME)
                  }
                  python tools/package_release.py `
                      --dll build/windows/x64/releasedbg/HouseRules.dll `
                      --pdb build/windows/x64/releasedbg/HouseRules.pdb `
                      --zip @releaseArgs
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: HouseRules-${{ github.sha }}
                  path: build/HouseRules-*.zip
                  compression-level: 0
                  if-no-files-found: error

    release:
        needs: build
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download build artifact
              uses: actions/download-artifact@v4
              with:
                  name: HouseRules-${{ github.sha }}
                  path: artifact

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: artifact/HouseRules-*.zip
                  fail_on_unmatched_files: true
                  generate_release_notes: true
